# Análisis de calidad con SonarQube Cloud (job "Calidad (SonarQube)" del CI)
sonar.organization=dela2910
sonar.projectKey=dela2910_Coestudia-frontend
sonar.projectName=Coestudia frontend

sonar.sources=src
sonar.tests=src
sonar.exclusions=src/**/*.test.js,src/**/*.test.jsx,src/test/**
sonar.test.inclusions=src/**/*.test.js,src/**/*.test.jsx,src/test/**
# Lo genera npm run coverage en el job Test
sonar.javascript.lcov.reportPaths=coverage/lcov.info
